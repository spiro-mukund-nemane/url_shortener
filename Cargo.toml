[package]
name = "url_shortener"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
dotenvy = "0.15.7"
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono"] }
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
